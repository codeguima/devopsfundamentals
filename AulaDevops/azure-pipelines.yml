# Starter pipeline
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  # Instalar o Terraform
  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'  

  # Inicializar o Terraform
  - task: TerraformTaskV4@4
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      backendServiceArm: 'Desenvolvimento2'  # Nome correto da Service Connection
      backendAzureRmResourceGroupName: 'rg-terraformdevops-001'
      backendAzureRmStorageAccountName: 'stterraformdevopsdev001'
      backendAzureRmContainerName: 'terraform-state'
      backendAzureRmKey: 'terraform.tfstate'  # Nome do arquivo de estado, não uma chave secreta!

  # Validar a configuração do Terraform
  - task: TerraformTaskV4@4
    displayName: 'Terraform Validate'
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(Build.SourcesDirectory)'  # Corrigido alinhamento!

  # Publicar os arquivos como artefato do pipeline
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Terraform State'
    inputs:
      targetPath: '$(Build.SourcesDirectory)'  # Caminho dos arquivos gerados
      artifact: 'terraform-state'  # Nome do artefato
      publishLocation: 'pipeline'
